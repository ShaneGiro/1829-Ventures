name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest

    # Postgres needs BOTH PostGIS and pgvector, so we build our custom image
    # (docker/postgres) and run it as a container — GitHub `services:` can only
    # pull prebuilt images, and no official image bundles both extensions.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://crm:crm@localhost:5432/crm_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Start Postgres (PostGIS + pgvector)
        run: |
          docker build -t ventures-crm-postgres:ci docker/postgres
          docker run -d --name crm-postgres \
            -e POSTGRES_USER=crm -e POSTGRES_PASSWORD=crm -e POSTGRES_DB=crm_test \
            -p 5432:5432 ventures-crm-postgres:ci
          for i in $(seq 1 30); do
            docker exec crm-postgres pg_isready -U crm -d crm_test && break
            sleep 2
          done
        working-directory: .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy

      - name: pytest with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml

  # Frontend lint/typecheck/test job is added by Agent 20.
